# Database ? reads from environment variables, falls back to local values
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/padhai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Port ? Render provides its own PORT; locally defaults to 8080
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:localDevSecretKeyChangeInProductionMakeItLongAndRandom12345}
jwt.expiration=86400000

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
spring.profiles.active=local
# Allowed frontend origin for CORS
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

vdocipher.secret=${VDOCIPHER_SECRET:}